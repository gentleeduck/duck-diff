name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: bun-linux-x64 bun-linux-arm64
          # macOS binaries are built natively so they carry the signature Apple Silicon requires.
          - os: macos-latest
            targets: bun-darwin-arm64 bun-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Tag matches the version
        run: test "v$(jq -r .version apps/server/package.json)" = "$GITHUB_REF_NAME"
      - run: bun run --filter @duck-diff/web build
      - run: bun scripts/gen-web-assets.ts
      - name: Compile
        run: for target in ${{ matrix.targets }}; do bun scripts/build-binary.ts --target "$target"; done
      - name: Smoke test the native binary
        run: |
          for bin in apps/server/dist/duck-diff-*; do
            "$bin" --version 2>/dev/null && echo "ran $bin" || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.os }}
          path: apps/server/dist/duck-diff-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum duck-diff-* > checksums.txt && cat checksums.txt
      # The release notes are the version's own section of CHANGELOG.md, with GitHub's list of changes after it.
      - name: Notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## $version" '$0 == head { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes

  # The curl install line from the README, run against the release just published.
  install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install with install.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh install.sh --version "${GITHUB_REF_NAME#v}" --dir "$HOME/.local/bin"
      - name: The installed binary is this release
        run: test "$("$HOME/.local/bin/duck-diff" --version)" = "${GITHUB_REF_NAME#v}"
