version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A week for a bad release to be pulled before it lands here.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - ci
    groups:
      # init and analyze must run the same version, so every codeql-action step moves in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
